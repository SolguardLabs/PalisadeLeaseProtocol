name: CI

on:
  pull_request:
  push:
    branches: [main, production, "production/**"]
    tags: ["v*"]

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run CI
        run: bash scripts/ci.sh
